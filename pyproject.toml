[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "minivla-benchmark"
version = "0.2.0"
description = "CLI toolkit for benchmarking, optimizing, and scaling VLA inference pipelines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.45.0",
    "accelerate>=0.25.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "ray[serve]>=2.9.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
]

[project.scripts]
minivla = "cli:cli"
