[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minivla-benchmark"
version = "0.3.0"
description = "Benchmark SmolVLA inference optimizations (fp16/bf16, int8, structured pruning) on real LIBERO frames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "Pillow>=10.0",
    "psutil>=5.9",
    "matplotlib>=3.7",
    "click>=8.1",
]

[project.optional-dependencies]
# LeRobot 0.6.1 needs Python >= 3.12 and torch < 2.12.
lerobot = ["lerobot[smolvla,dataset]==0.6.1"]
ray = ["ray[serve,data]>=2.9"]
gpu = ["bitsandbytes>=0.43"]
test = ["pytest>=7"]

[project.scripts]
minivla = "cli:cli"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["models*", "pipeline*", "ray_workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs LeRobot's real SmolVLA / dataset code on tiny local fixtures (needs lerobot)"]
